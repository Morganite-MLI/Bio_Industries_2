bio-industries=Oferece construções e itens biotécnologicos úteis, como a Fazenda Biológica para o cultivo de árvores. Fazenda Solar e Acumulador imenso para facilitar sua instalação elétrica. Seção de Biocombustíveis para produzir plástico orgânico e baterias. Diversos produtos de Madeira novos, como o poste de madeira enorme, canos de madeira e torre de dardos. Plante árvores usando mudas. Terraforme terrenos desérticos em pastagens utilizando Fertilizante - ajude as árvores a crescerem melhor. E muito mais... Visite a página inicial dos fóruns para obter mais informações e feedback.